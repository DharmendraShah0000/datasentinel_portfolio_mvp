services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datasentinel
      POSTGRES_USER: datasentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U datasentinel -d datasentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://datasentinel:${POSTGRES_PASSWORD:-local_dev_change_me}@db:5432/datasentinel
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
